<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Patient Zero</title>
<style>
  :root{
    --bg:#08090d;
    --panel:rgba(255,255,255,.035);
    --panel-solid:#101218;
    --line:rgba(255,255,255,.08);
    --line-soft:rgba(255,255,255,.05);
    --fg:#e7e9ee;
    --dim:#868f9f;
    --dimmer:#5c6473;
    --seed:#ff4d4d;
    --hop1:#ff9550;
    --hop2:#ffd166;
    --pruned:#343b47;
    --panelW:312px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--fg); overflow:hidden;
    font:400 14px/1.55 ui-sans-serif,-apple-system,"SF Pro Text","Segoe UI",Inter,sans-serif;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  canvas{display:block;cursor:grab}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:1;
       background:radial-gradient(120% 90% at 44% 46%,rgba(255,150,80,.05),transparent 62%),
                  radial-gradient(100% 100% at 50% 50%,transparent 56%,rgba(0,0,0,.6) 100%)}

  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}

  /* ---------- header ---------- */
  #head{position:fixed;top:0;left:0;right:0;z-index:6;padding:20px 24px 30px;pointer-events:none;
        background:linear-gradient(180deg,rgba(8,9,13,.94) 0%,rgba(8,9,13,.72) 55%,transparent 100%)}
  .eyebrow{font-size:10.5px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer)}
  h1{font-size:19px;font-weight:640;letter-spacing:-.012em;margin-top:5px;line-height:1.32;max-width:58ch}
  #badge{display:inline-flex;align-items:center;vertical-align:3px;margin-left:9px;
         padding:3px 9px;border-radius:999px;font-size:9.5px;font-weight:700;letter-spacing:.08em;
         text-transform:uppercase;background:rgba(255,77,77,.13);color:#ff8080;
         border:1px solid rgba(255,77,77,.32)}
  #badge.hypo{background:rgba(255,209,102,.12);color:#ffd166;border-color:rgba(255,209,102,.32)}

  #stats{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:9px 14px 10px;min-width:76px;backdrop-filter:blur(7px)}
  .stat .v{font-size:17px;font-weight:640;letter-spacing:-.02em;line-height:1.15}
  .stat .k{font-size:10px;color:var(--dim);margin-top:3px;letter-spacing:.035em}
  .stat.alert .v{color:#ff8080}

  /* ---------- view controls ---------- */
  #ctrl{position:fixed;top:22px;right:calc(var(--panelW) + 22px);z-index:8;display:flex;gap:6px}
  .btn{background:var(--panel);border:1px solid var(--line);color:var(--dim);
       border-radius:8px;padding:7px 12px;font:inherit;font-size:11.5px;font-weight:600;
       letter-spacing:.03em;cursor:pointer;backdrop-filter:blur(8px);
       transition:color .13s,background .13s,border-color .13s}
  .btn:hover{color:var(--fg);background:rgba(255,255,255,.07)}
  .btn.on{color:#ffcaa0;background:rgba(255,149,80,.14);border-color:rgba(255,149,80,.36)}

  /* ---------- right panel ---------- */
  #side{position:fixed;top:0;right:0;bottom:0;width:var(--panelW);z-index:7;
        background:linear-gradient(90deg,rgba(8,9,13,0),rgba(12,14,19,.93) 16%,var(--panel-solid) 100%);
        border-left:1px solid var(--line);display:flex;flex-direction:column}
  #side h2{font-size:10.5px;font-weight:650;letter-spacing:.13em;text-transform:uppercase;
           color:var(--dimmer);padding:22px 20px 5px}
  #side .note{font-size:11.5px;color:var(--dim);padding:0 20px 14px;line-height:1.5}
  #list{overflow-y:auto;padding:0 12px 18px;flex:1;scrollbar-width:thin;
        scrollbar-color:rgba(255,255,255,.14) transparent}
  #list::-webkit-scrollbar{width:8px}
  #list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13);border-radius:99px}
  .row{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:10px 9px;border-radius:9px;
       cursor:pointer;border:1px solid transparent;transition:background .13s,border-color .13s}
  .row:hover{background:rgba(255,255,255,.045);border-color:var(--line-soft)}
  .row.on{background:rgba(255,149,80,.11);border-color:rgba(255,149,80,.33)}
  .rank{font-size:11px;color:var(--dimmer);text-align:right;padding-top:2px;font-weight:600}
  .ttl{font-size:12.3px;line-height:1.42;color:#dfe3ea;
       display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta{font-size:10.5px;color:var(--dim);margin-top:5px;display:flex;align-items:center;gap:7px}
  .pip{width:6px;height:6px;border-radius:50%;flex:none}
  .flag{color:#ff8080;font-weight:650}

  /* ---------- legend ---------- */
  #legend{position:fixed;bottom:18px;left:24px;z-index:6;pointer-events:none;
          background:var(--panel);border:1px solid var(--line);border-radius:12px;
          padding:13px 16px;backdrop-filter:blur(9px);font-size:11.5px;color:var(--dim)}
  #legend .li{display:flex;align-items:center;gap:9px;margin-top:7px}
  #legend .li:first-of-type{margin-top:0}
  #legend .sw{width:9px;height:9px;border-radius:50%;flex:none}
  #legend .hint{margin-top:11px;padding-top:10px;border-top:1px solid var(--line-soft);
                font-size:10.5px;color:var(--dimmer);letter-spacing:.02em;max-width:31ch;line-height:1.5}

  /* ---------- tooltip ---------- */
  #tip{position:fixed;z-index:20;max-width:330px;padding:12px 14px;border-radius:12px;
       background:rgba(16,18,24,.97);border:1px solid var(--line);
       box-shadow:0 16px 44px rgba(0,0,0,.66);font-size:12.4px;display:none;pointer-events:none;
       backdrop-filter:blur(11px)}
  #tip .t{font-weight:600;line-height:1.42;margin-bottom:8px;color:#f0f2f6}
  #tip .g{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;font-size:11.5px}
  #tip .g dt{color:var(--dim)}
  #tip .g dd{color:#dfe3ea}
  #tip .bar{height:3px;border-radius:99px;background:rgba(255,255,255,.09);margin-top:10px;overflow:hidden}
  #tip .bar i{display:block;height:100%;border-radius:99px}
  #tip .warn{margin-top:9px;font-size:10px;font-weight:700;letter-spacing:.07em;
             text-transform:uppercase;color:#ff8080}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div>

<header id="head">
  <div class="eyebrow">Patient Zero</div>
  <h1><span id="h1txt"></span><span id="badge"></span></h1>
  <div id="stats"></div>
</header>

<div id="ctrl">
  <button class="btn" id="bMode">3D</button>
  <button class="btn on" id="bSpin">Spin</button>
  <button class="btn" id="bFit">Fit</button>
</div>

<aside id="side">
  <h2>Most affected</h2>
  <div class="note">Ranked by inconsistency, weighted by how much rests on each paper. Click a row to focus it.</div>
  <div id="list"></div>
</aside>

<div id="legend">
  <div class="li"><i class="sw" style="background:var(--seed)"></i> Overturned source</div>

  <div class="li"><i class="sw" style="background:var(--pruned)"></i> Pruned, not load bearing</div>
  <div class="hint" id="hint"></div>
</div>

<div id="tip"></div>

        b.vx3+=dx*f; b.vy3+=dy*f; b.vz3+=dz*f;
      }
    }
  }
  for (const {s,t} of L){
    const dx=t.x-s.x, dy=t.y-s.y, dz=t.z-s.z, d=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    const f=(d-300)*0.0012;
    s.vx3+=dx/d*f; s.vy3+=dy/d*f; s.vz3+=dz/d*f;
    t.vx3-=dx/d*f; t.vy3-=dy/d*f; t.vz3-=dz/d*f;
  }
  for (const n of nodes){
    if (n.shell===0){ n.vx3+=(0-n.x)*.22; n.vy3+=(0-n.y)*.22; n.vz3+=(0-n.z)*.22; continue; }
    const d=Math.sqrt(n.x*n.x+n.y*n.y+n.z*n.z)||1, pull=(n.shell-d)*.18;
    n.vx3+=n.x/d*pull; n.vy3+=n.y/d*pull; n.vz3+=n.z/d*pull;
  }
  for (const n of nodes){ n.x+=n.vx3*=.78; n.y+=n.vy3*=.78; n.z+=n.vz3*=.78; }
}

/* ============ camera and projection ============ */
let mode3d=true, spin=true, zoom=1, ox=0, oy=0;
let yaw=0.6, pitch=-0.28, drag=null;
const FL=1150, CAMZ=2350;
const RMAX = Math.max(...nodes.map(n=>Math.hypot(n.x,n.y,n.z)+n.r), 1);

/* returns [screenX, screenY, depth, scaleFactor] */
function project(n){
  if (!mode3d){
    return [n.px*zoom+ox, n.py*zoom+oy, 0, zoom];
  }
  const cy=Math.cos(yaw), sy=Math.sin(yaw), cp=Math.cos(pitch), sp=Math.sin(pitch);
  const x1 =  n.x*cy - n.z*sy;
  const z1 =  n.x*sy + n.z*cy;
  const y2 =  n.y*cp - z1*sp;
  const z2 =  n.y*sp + z1*cp;
  const depth = z2 + CAMZ;
  const k = (FL / Math.max(120, depth)) * zoom;
  return [x1*k + ox, y2*k + oy, depth, k];
}

function viewport(){
  const padL=56, padR=PANEL+40, padT=182, padB=152;
  return {padL, padR, padT, padB,
          w:Math.max(220,W-padL-padR), h:Math.max(220,H-padT-padB)};
}
function fit(){
  const v=viewport();
  ox = v.padL + v.w/2; oy = v.padT + v.h/2;
  if (mode3d){
    /* Fit the bounding sphere. Measuring at mid depth rather than the nearest
       point fills the frame far better and still cannot clip under rotation,
       because perspective shrinks whatever swings to the back. */
    const k = FL/(CAMZ - RMAX*0.45);
    zoom = Math.min(v.w/(2*RMAX*k), v.h/(2*RMAX*k), 1.6) * 1.16;
  } else {
    let a=1e9,b=-1e9,c2=1e9,d2=-1e9;
    for (const n of nodes){
      a=Math.min(a,n.px-n.r); b=Math.max(b,n.px+n.r);
      c2=Math.min(c2,n.py-n.r); d2=Math.max(d2,n.py+n.r);
    }
    const gw=b-a||1, gh=d2-c2||1;
    zoom=Math.min(v.w/gw, v.h/gh, 1.15);
    ox = v.padL - a*zoom + (v.w-gw*zoom)/2;
    oy = v.padT - c2*zoom + (v.h-gh*zoom)/2;
  }
}
addEventListener('resize', ()=>{ size(); fit(); draw(); });

const COL={seed:'#ff4d4d',h1:'#ff9550',h2:'#ffd166',h3:'#9aa5b4',pruned:'#343b47'};
const colorOf = n => n.pruned ? COL.pruned
  : n.hop===0 ? COL.seed : n.hop===1 ? COL.h1 : n.hop===2 ? COL.h2 : COL.h3;

let focus=null, hover=null;
function neighbours(n){
  const s=new Set();
  for (const l of L){ if (l.s===n) s.add(l.t); if (l.t===n) s.add(l.s); }
  return s;
}
/* depth 0 at the front of the scene, 1 at the back */
const depthT = d => mode3d ? Math.min(1,Math.max(0,(d-(CAMZ-RMAX))/(2*RMAX||1))) : 0;

/* One camera facing circle per hop shell. Without these the shells overlap in
   projection and the concentric structure that carries the meaning disappears. */
const SHELL_RADII=[...new Set(nodes.map(n=>n.shell))].filter(r=>r>1).sort((a,b)=>a-b);
function drawShells(){
  const k=(FL/CAMZ)*zoom;
  for (const R of SHELL_RADII){
    cx.beginPath(); cx.arc(ox,oy,R*k,0,7);
    cx.strokeStyle='rgba(255,255,255,.055)'; cx.lineWidth=1; cx.setLineDash([3,7]); cx.stroke();
    cx.setLineDash([]);
  }
}

function draw(){
  cx.clearRect(0,0,W,H);
  const active=focus||hover, near=active?neighbours(active):null;
  if (mode3d && !active) drawShells();

  const P=new Map();
  for (const n of nodes) P.set(n, project(n));

  /* edges back to front so nearer links sit on top */
  const edges=L.map(l=>({l, d:(P.get(l.s)[2]+P.get(l.t)[2])/2})).sort((a,b)=>b.d-a.d);
  for (const {l} of edges){
    const A=P.get(l.s), B=P.get(l.t);
    const t=depthT((A[2]+B[2])/2), fade=1-t*0.72;
    let col=`rgba(255,149,80,${(.20*fade).toFixed(3)})`, lw=.9*(1-t*.35);
    if (l.s.pruned||l.t.pruned){ col=`rgba(52,59,71,${(.22*fade).toFixed(3)})`; lw=.5; }
    if (active){
      const on = l.s===active||l.t===active;
      col = on ? `rgba(255,183,115,${(.85*fade).toFixed(3)})` : 'rgba(255,149,80,.045)';
      lw  = on ? 1.6*(1-t*.3) : .45;
    }
    cx.strokeStyle=col; cx.lineWidth=Math.max(.35,lw);
    cx.beginPath(); cx.moveTo(A[0],A[1]); cx.lineTo(B[0],B[1]); cx.stroke();
  }

  /* nodes back to front, seed drawn late so its glow reads */
  const order=[...nodes].sort((a,b)=>{
    const d=P.get(b)[2]-P.get(a)[2];
    if (a.hop===0) return 1; if (b.hop===0) return -1;
    return d;
  });
  for (const n of order){
    const [x,y,d,k]=P.get(n);
    const r=Math.max(n.hop===0?7:1.8, n.r*k);
    const t=depthT(d);
    const lit = !active || n===active || near.has(n);
    cx.globalAlpha = (lit ? (n.pruned?.55:1) : .14) * (1 - t*0.55);

    if (n.hop===0){
      const g=cx.createRadialGradient(x,y,r*.5,x,y,r+26*k);
      g.addColorStop(0,'rgba(255,77,77,.4)'); g.addColorStop(1,'rgba(255,77,77,0)');
      cx.fillStyle=g; cx.beginPath(); cx.arc(x,y,r+26*k,0,7); cx.fill();
    }
    if (n===active){
      cx.beginPath(); cx.arc(x,y,r+7,0,7);
      cx.strokeStyle='rgba(255,255,255,.55)'; cx.lineWidth=1.4; cx.stroke();
    }
    cx.beginPath(); cx.arc(x,y,r,0,7); cx.fillStyle=colorOf(n); cx.fill();
    if (n.is_retracted){
      cx.beginPath(); cx.arc(x,y,r+2.3,0,7);
      cx.strokeStyle='rgba(255,255,255,.8)'; cx.lineWidth=1.4; cx.stroke();
    }
    cx.globalAlpha=1;
  }

  cx.font='600 11px ui-sans-serif,-apple-system,sans-serif';
  cx.textAlign='center';
  const big=[...nodes].sort((a,b)=>b.cited_by_count-a.cited_by_count).slice(0,5);
  for (const n of big){
    if (active && n!==active && !near.has(n)) continue;
    const [x,y,d,k]=P.get(n);
    cx.globalAlpha=1-depthT(d)*0.6;
    cx.fillStyle='rgba(231,233,238,.92)';
    cx.fillText(fmt(n.cited_by_count), x, y-Math.max(1.8,n.r*k)-8);
    cx.globalAlpha=1;
  }
}

/* ---------- header ---------- */
document.getElementById('h1txt').textContent = META.seed_title;
const badge=document.getElementById('badge');
badge.textContent = META.verified ? 'Verified retraction' : 'Hypothetical';
if (!META.verified) badge.classList.add('hypo');

const STATS=[
  {v:fmt(META.n_papers), k:'papers traced'},
  {v:fmt(META.n_edges), k:'citation links'},
  {v:fmt(META.seed_cites), k:'cite the source'},
  {v:fmt(META.top_cites), k:'rest on top result'},
  {v:fmt(META.retracted_downstream), k:'further retractions', alert:META.retracted_downstream>0}
];
document.getElementById('stats').innerHTML = STATS.map(s=>
  `<div class="stat${s.alert?' alert':''}"><div class="v num">${s.v}</div><div class="k">${s.k}</div></div>`
).join('');

/* ---------- ranked panel ---------- */
const ranked = nodes.filter(n=>!n.is_overturned && !n.pruned)
                    .sort((a,b)=>b.priority-a.priority).slice(0,14);
listEl.innerHTML = ranked.map((n,i)=>`
  <div class="row" data-id="${n.id}">
    <div class="rank num">${i+1}</div>
    <div>
      <div class="ttl">${esc(n.title)}</div>
      <div class="meta">
        <i class="pip" style="background:${colorOf(n)}"></i>
        <span class="num">${fmt(n.cited_by_count)} citations</span>
        <span>hop ${n.hop}</span>
        ${n.is_retracted?'<span class="flag">retracted</span>':''}
      </div>
    </div>
  </div>`).join('');
function syncRows(){
  listEl.querySelectorAll('.row').forEach(r=>
    r.classList.toggle('on', !!focus && r.dataset.id===focus.id));
}
listEl.querySelectorAll('.row').forEach(row=>{
  row.addEventListener('click',()=>{
    const n=byId.get(row.dataset.id);
    focus = focus===n ? null : n;
    syncRows(); draw();
  });
});

/* ---------- controls ---------- */
const bMode=document.getElementById('bMode'), bSpin=document.getElementById('bSpin'),
      bFit=document.getElementById('bFit'), hint=document.getElementById('hint');
function syncHint(){
  hint.textContent = mode3d
    ? 'Size shows citation count. Drag to orbit, scroll to zoom, F to refit.'
    : 'Size shows citation count. Drag to pan, scroll to zoom, F to refit.';
  bMode.textContent = mode3d ? '3D' : '2D';
  bMode.classList.toggle('on', mode3d);
  bSpin.classList.toggle('on', spin && mode3d);
  bSpin.disabled = !mode3d;
  bSpin.style.opacity = mode3d ? 1 : .4;
}
bMode.addEventListener('click',()=>{ mode3d=!mode3d; fit(); syncHint(); draw(); });
bSpin.addEventListener('click',()=>{ spin=!spin; syncHint(); });
bFit.addEventListener('click',()=>{ fit(); draw(); });
syncHint();
fit(); draw();

/* ---------- animation: idle orbit, paused while interacting ---------- */
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  if (!mode3d || !spin || drag || hover || focus) { last=ts; return; }
  if (ts-last < 16) return;
  last=ts;
  yaw += 0.0022;
  draw();
}
requestAnimationFrame(frame);

/* ---------- interaction ---------- */
function ptOf(e){ const r=cv.getBoundingClientRect(); return [e.clientX-r.left, e.clientY-r.top]; }
function hit(mx,my){
  let best=null,bd=1e9,bestDepth=1e9;
  for (const n of nodes){
    const [x,y,d,k]=project(n);
    const r=Math.max(7,n.r*k)+4, dist=Math.hypot(mx-x,my-y);
    /* prefer the nearer node when two overlap in screen space */
    if (dist<r && (d<bestDepth-1 || (Math.abs(d-bestDepth)<=1 && dist<bd))){
      bd=dist; bestDepth=d; best=n;
    }
  }
  return best;
}
function showTip(n,e){
  const pct=Math.round(n.inconsistency*100);
  tip.innerHTML=`<div class="t">${esc(n.title)}</div>
    <dl class="g">
      <dt>Published</dt><dd class="num">${n.year||'unknown'}</dd>
      <dt>Citations</dt><dd class="num">${fmt(n.cited_by_count)}</dd>
      <dt>Distance</dt><dd>hop ${n.hop}${n.hop===0?' (the source)':''}</dd>
      <dt>Inconsistency</dt><dd class="num">${n.inconsistency.toFixed(3)}</dd>
    </dl>
    <div class="bar"><i style="width:${pct}%;background:${colorOf(n)}"></i></div>
    ${n.is_retracted && !n.is_overturned ? '<div class="warn">Also retracted</div>':''}`;
  tip.style.display='block';
  const r=tip.getBoundingClientRect();
  tip.style.left=Math.max(12, Math.min(e.clientX+16, innerWidth-PANEL-r.width-16))+'px';
  tip.style.top =Math.max(12, Math.min(e.clientY+16, innerHeight-r.height-16))+'px';
}
cv.addEventListener('mousedown',e=>{
  const [x,y]=ptOf(e);
  drag={x,y,ox,oy,yaw,pitch}; cv.style.cursor='grabbing';
});
addEventListener('mouseup',()=>{ drag=null; cv.style.cursor='grab'; });
cv.addEventListener('mousemove',e=>{
  const [mx,my]=ptOf(e);
  if (drag){
    if (mode3d){
      yaw   = drag.yaw   + (mx-drag.x)*0.006;
      pitch = Math.max(-1.35, Math.min(1.35, drag.pitch + (my-drag.y)*0.006));
    } else {
      ox = drag.ox+(mx-drag.x); oy = drag.oy+(my-drag.y);
    }
    draw(); return;
  }
  const n=hit(mx,my);
  if (n!==hover){ hover=n; draw(); }
  if (n) showTip(n,e); else tip.style.display='none';
});
cv.addEventListener('mouseleave',()=>{ hover=null; tip.style.display='none'; draw(); });
cv.addEventListener('click',e=>{
  const [mx,my]=ptOf(e); const n=hit(mx,my);
  focus = (n && focus!==n) ? n : null;
  syncRows(); draw();
});
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const k=e.deltaY<0?1.12:1/1.12, [mx,my]=ptOf(e);
  if (!mode3d){ ox=mx-(mx-ox)*k; oy=my-(my-oy)*k; }
  zoom*=k; draw();
},{passive:false});
addEventListener('keydown',e=>{
  if (e.key==='Escape'){ focus=null; syncRows(); draw(); }
  if (e.key==='f'||e.key==='F'){ fit(); draw(); }
  if (e.key==='d'||e.key==='D'){ mode3d=!mode3d; fit(); syncHint(); draw(); }
});
</script>
</body>
</html>
